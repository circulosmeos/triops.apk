// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    // 20180128: use a lower gradle version than the last (v2.2.0)
    System.properties['com.android.build.gradle.overrideVersionCheck'] = 'true'

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2' // or 8.2.0
    }

}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}